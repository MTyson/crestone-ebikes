<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded container with Crestone Forest Green -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.35" fill="none" />

  <!-- Mountain Silhouette in subtle background -->
  <path d="M6 46 L20 28 L32 40 L44 24 L58 46 Z" fill="#047857" opacity="0.35" />

  <!-- Bicycle -->
  <g filter="url(#glow)">
    <!-- Rear Wheel -->
    <circle cx="17" cy="42" r="9.5" stroke="#f5f5f4" stroke-width="3" fill="none" />
    <circle cx="17" cy="42" r="1.5" fill="#f5f5f4" />

    <!-- Front Wheel -->
    <circle cx="47" cy="42" r="9.5" stroke="#f5f5f4" stroke-width="3" fill="none" />
    <circle cx="47" cy="42" r="1.5" fill="#f5f5f4" />

    <!-- Bike Frame Structure -->
    <path
      d="M17 42 L29 42 L25 27 M17 42 L25 27 L41 27 L29 42 M41 27 L47 42"
      stroke="#f5f5f4"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Handlebars -->
    <path
      d="M41 27 L42 21 L46 21"
      stroke="#f5f5f4"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Saddle -->
    <path
      d="M25 27 L24 23 M20 23 L26 23"
      stroke="#f5f5f4"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Electric Lightning Bolt (Amber / Gold Accent) -->
    <path
      d="M34 14 L27 27 L33 27 L29 39 L40 25 L34 25 Z"
      fill="#fbbf24"
      stroke="#d97706"
      stroke-width="0.75"
      stroke-linejoin="round"
    />
  </g>
</svg>

